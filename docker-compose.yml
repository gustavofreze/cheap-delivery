name: cheap-delivery

services:
  cheap-delivery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    cpus: 1.0
    restart: unless-stopped
    hostname: cheap-delivery
    mem_limit: 512m
    container_name: cheap-delivery
    stop_grace_period: 30s
    env_file:
      - path: .env.local
        required: true
    volumes:
      - ./src:/var/www/html/src
    depends_on:
      cheap-delivery-migrate:
        condition: service_completed_successfully

  cheap-delivery-adm:
    image: mysql:8.4
    cpus: 1.0
    restart: unless-stopped
    hostname: cheap-delivery-adm
    mem_limit: 1g
    container_name: cheap-delivery-adm
    environment:
      MYSQL_DATABASE: "${DATABASE_NAME}"
      MYSQL_ROOT_PASSWORD: "${DATABASE_PASSWORD}"
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    command:
      - --host-cache-size=0
      - --pid-file=/var/lib/mysql/mysqld.pid
    ports:
      - "3406:3306"
    volumes:
      - cheap-delivery-adm-data:/var/lib/mysql
    tmpfs:
      - /run/mysqld:uid=999,gid=999,mode=0750
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  cheap-delivery-migrate:
    image: flyway/flyway:13.7
    cpus: 0.5
    hostname: cheap-delivery-migrate
    mem_limit: 256m
    container_name: cheap-delivery-migrate
    env_file:
      - path: .env.local
        required: true
    command: ["-connectRetries=60", "migrate"]
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      cheap-delivery-adm:
        condition: service_healthy

  cheap-delivery-web:
    image: nginx:1.31-alpine
    cpus: 0.5
    restart: unless-stopped
    hostname: cheap-delivery-web
    mem_limit: 128m
    container_name: cheap-delivery-web
    ports:
      - "8190:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      cheap-delivery:
        condition: service_healthy

volumes:
  cheap-delivery-adm-data:
